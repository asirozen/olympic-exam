<style>
:root{
  --night:#0B1B36; --lane:#14294C; --line:rgba(255,255,255,.07);
  --paper:#FAFAF7; --ink:#13213C; --muted:#5B6B85; --rule:#E2E6EE;
  --blue:#0081C8; --yellow:#FCB131; --green:#00A651; --red:#EE334E; --gold:#E0B33A;
  --radius:18px;
  --display:"Secular One","Assistant",Arial,sans-serif;
  --body:"Assistant",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--body);color:var(--ink);font-size:17px;line-height:1.55;
  background:var(--night);
  /* קווי מסלול ריצה */
  background-image:
    repeating-radial-gradient(ellipse 140% 90% at 112% 118%, transparent 0 54px, var(--line) 54px 57px);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 120px}

/* חמשת המסלולים */
.lanes{display:grid;gap:3px}
.lanes i{display:block;height:4px;border-radius:2px}
.lanes i:nth-child(1){background:var(--blue)} .lanes i:nth-child(2){background:var(--yellow)}
.lanes i:nth-child(3){background:#fff} .lanes i:nth-child(4){background:var(--green)}
.lanes i:nth-child(5){background:var(--red)}

/* ---------- כניסה ---------- */
.hero{color:#fff;padding:28px 4px 22px}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(38px,10vw,64px);line-height:1;margin:0 0 14px;letter-spacing:-.5px}
.hero p{margin:12px 0 0;color:#C9D3E6;font-size:18px}
.hero p.subline{font-family:var(--display);font-size:clamp(22px,6vw,28px);line-height:1.3;color:#fff;margin-top:16px}
.hero .lanes{max-width:260px}
.card{background:var(--paper);border-radius:var(--radius);padding:22px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.field{margin-bottom:14px}
.field label{display:block;font-weight:700;margin-bottom:6px;font-size:15px}
.field input,.field select{width:100%;padding:13px 14px;border:2px solid var(--rule);border-radius:12px;background:#fff;font-size:18px}
.field input:focus,.field select:focus{border-color:var(--blue);outline:none}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:14px;color:var(--muted);margin-top:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 22px;font-weight:700;font-size:18px;cursor:pointer;background:var(--blue);color:#fff;min-height:52px}
.btn:hover{filter:brightness(1.07)}
.btn:disabled{opacity:.55;cursor:wait}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--rule)}
.btn.go{background:var(--green)}
.err{background:#FDECEF;color:#9B1C31;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-weight:600}
.demo{background:var(--yellow);color:#3B2A00;border-radius:12px;padding:10px 14px;margin-bottom:16px;font-weight:600;font-size:15px}

/* ---------- הוראות ---------- */
.intro h2{font-family:var(--display);font-weight:400;font-size:30px;margin:0 0 6px}
.intro .series{display:inline-block;background:var(--night);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;margin-bottom:14px}
.parts{list-style:none;padding:0;margin:16px 0 20px;display:grid;gap:10px}
.parts li{border-inline-start:5px solid var(--blue);background:#fff;border-radius:10px;padding:10px 14px}
.parts li:nth-child(2){border-color:var(--yellow)} .parts li:nth-child(3){border-color:var(--green)}
.parts b{display:block}

/* ---------- סרגל עליון ---------- */
.topbar{position:sticky;top:0;z-index:5;background:var(--night);padding:calc(env(safe-area-inset-top) + 10px) 16px 12px;color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.topbar .in{max-width:720px;margin:0 auto}
.tb-row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.who{font-weight:600;font-size:15px;color:#C9D3E6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clock{font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:10px;background:var(--lane)}
.clock.warn{background:var(--red);animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{to{filter:brightness(1.25)}}
@media (prefers-reduced-motion:reduce){.clock.warn{animation:none}}

/* מסלול התקדמות — הרץ מתקדם עם כל תשובה */
.track{position:relative;padding:4px 0}
.track .lanes i{opacity:.16}
.track .fill i{opacity:1}
.track .fill{position:absolute;inset-block:4px;inset-inline-start:0;display:grid;gap:3px;overflow:hidden;transition:width .4s ease}
.track .fill i{width:calc(100vw);max-width:720px}
.runner{position:absolute;top:50%;transform:translate(50%,-50%);background:#fff;color:var(--night);font-weight:700;font-size:13px;border-radius:999px;padding:1px 9px;white-space:nowrap;transition:right .4s ease;box-shadow:0 2px 8px rgba(0,0,0,.4)}

/* ---------- שאלה ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:baseline;color:#C9D3E6;margin:18px 4px 10px;font-size:15px}
.qmeta b{color:#fff;font-size:16px}
.qcard{background:var(--paper);border-radius:var(--radius);padding:22px 20px 20px}
.qtext{font-size:21px;font-weight:700;line-height:1.45;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:#fff;border:2px solid var(--rule);border-radius:14px;padding:14px;cursor:pointer;min-height:56px;font-size:18px;transition:border-color .15s,background .15s}
.opt:hover{border-color:#B9C6DA}
.opt .dot{flex:0 0 26px;height:26px;border-radius:50%;border:2px solid #AEB9CC;display:grid;place-items:center}
.opt[aria-checked="true"]{border-color:var(--blue);background:#EAF5FC}
.opt[aria-checked="true"] .dot{border-color:var(--blue);background:var(--blue)}
.opt[aria-checked="true"] .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-weight:700}
.tf .opt .dot{display:none}
.tf .opt[aria-checked="true"]{color:#fff;background:var(--blue)}
.open-in{width:100%;padding:14px;border:2px solid var(--rule);border-radius:14px;font-size:19px;background:#fff}
.open-in:focus{border-color:var(--blue);outline:none}
.saved{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}

/* ---------- ניווט תחתון ---------- */
.bottombar{position:fixed;inset-inline:0;bottom:0;background:var(--paper);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:6}
.bottombar .in{max-width:720px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bottombar .btn{flex:1;padding:12px 10px}
.bottombar .btn.navbtn{flex:1.25;background:var(--night);font-size:17px;white-space:nowrap}
.gridic{display:inline-grid;grid-template-columns:7px 7px;gap:2px}
.gridic i{width:7px;height:7px;border-radius:2px;background:#fff}
@media (max-width:360px){.bottombar .btn{font-size:15px;padding-inline:6px}.gridic{display:none}}

/* מפת שאלות */
.sheet{position:fixed;inset:0;background:rgba(5,12,26,.6);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet .panel{background:var(--paper);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:80vh;overflow:auto}
.sheet h3{font-family:var(--display);font-weight:400;font-size:24px;margin:0 0 6px}
.grid-part{margin:14px 0 4px;font-weight:700;color:var(--muted);font-size:15px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px}
.qgrid button{display:flex;align-items:center;justify-content:center;height:46px;padding:0;margin:0;line-height:1;font-size:18px;border-radius:10px;border:2px solid #C9D2E0;background:#fff;color:var(--ink);font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.qgrid button.done{background:var(--green);border-color:var(--green);color:#fff}
.qgrid button.cur{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue)}
.legend{display:flex;gap:16px;font-size:14px;color:var(--muted);margin-top:4px}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-inline-end:6px;vertical-align:-1px;border:2px solid var(--rule)}
.legend .l-done::before{background:var(--green);border-color:var(--green)}
.legend .l-cur::before{border-color:var(--blue);box-shadow:0 0 0 2px var(--blue)}
.mapcount{font-weight:700;margin:4px 0 2px}

/* חלון אישור */
.modal{position:fixed;inset:0;background:rgba(5,12,26,.65);z-index:20;display:grid;place-items:center;padding:16px}
.modal[hidden]{display:none}
.modal .panel{background:var(--paper);border-radius:var(--radius);padding:24px;max-width:420px;width:100%}
.modal h3{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 8px}
.modal .acts{display:flex;gap:10px;margin-top:18px}
.modal .panel.out{border-top:8px solid var(--red)}
.modal .panel.out h3{color:#9B1C31}
.rule{background:#FDECEF;border-radius:10px;padding:10px 14px;color:#6E1424}
.modal .acts .btn{flex:1;white-space:nowrap;padding-inline:12px}

/* ---------- סיום ---------- */
.done{text-align:center;color:#fff;padding-top:40px}
.medal{width:150px;height:150px;margin:0 auto 22px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:44px;color:var(--night);position:relative;background:radial-gradient(circle at 35% 30%,#FFF3C4,var(--gold) 55%,#A9801C)}
.medal.silver{background:radial-gradient(circle at 35% 30%,#FFFFFF,#C9CFD8 55%,#8892A0)}
.medal.bronze{background:radial-gradient(circle at 35% 30%,#FFE1C2,#C98A4B 55%,#8A5426)}
.medal.plain{background:radial-gradient(circle at 35% 30%,#E9F4FF,#8EC5EA 55%,#3C7FAE);font-size:52px}
.done h2{font-family:var(--display);font-weight:400;font-size:36px;margin:0 0 8px}
.done p{color:#C9D3E6;font-size:18px;margin:6px 0}
.toast{position:fixed;bottom:90px;inset-inline:16px;max-width:520px;margin:0 auto;background:#9B1C31;color:#fff;border-radius:12px;padding:12px 16px;font-weight:600;z-index:30}
.toast[hidden]{display:none}
.spinner{width:20px;height:20px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- לוח בקרה למורה ---------- */
.adm h1{font-family:var(--display);font-weight:400;color:#fff;font-size:34px;margin:6px 0 14px}
.adm .card{margin-bottom:14px}
.state{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.state .lbl{font-family:var(--display);font-size:28px}
.state .lbl.on{color:var(--green)} .state .lbl.off{color:#9B1C31}
.state .dotc{display:inline-block;width:14px;height:14px;border-radius:50%;margin-inline-end:8px;vertical-align:2px}
.btn.red{background:#C21F3A}
.pwbig{font-family:var(--display);font-size:40px;letter-spacing:2px;direction:ltr;text-align:center;background:#fff;border:2px dashed var(--rule);border-radius:14px;padding:6px;margin:6px 0 12px}
.pwrow{display:flex;gap:8px}
.pwrow input{flex:1;padding:12px;border:2px solid var(--rule);border-radius:12px;font-size:18px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:14px;padding:12px 8px;text-align:center;border:2px solid var(--rule)}
.stat b{display:block;font-family:var(--display);font-size:34px;line-height:1.1}
.stat span{font-size:14px;color:var(--muted)}
.plist{list-style:none;padding:0;margin:10px 0 0}
.plist li{display:flex;justify-content:space-between;gap:10px;padding:9px 2px;border-bottom:1px solid var(--rule)}
.plist .late{color:#C21F3A;font-weight:700}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.links .btn{font-size:16px;text-decoration:none}
.small{font-size:14px;color:#9FB0CC;text-align:center;margin-top:10px}
.logo{display:inline-grid;place-items:center;background:#fff;border-radius:50%;box-shadow:0 6px 18px rgba(0,0,0,.35);flex:0 0 auto}
.logo img{width:78%;height:78%;object-fit:contain;display:block}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:16px;color:#C9D3E6;font-weight:700;font-size:16px}
.tb-who{display:flex;align-items:center;gap:10px;min-width:0}
@media (max-width:420px){.row2{grid-template-columns:1fr}.qtext{font-size:19px}.card,.qcard{padding:18px 16px}}
</style>
</head>
<body>
<main id="app"></main>

<div class="sheet" id="mapSheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="mapTitle">

</div>

<div class="modal" id="outModal" hidden>

</div>

const logo = (px) => `<span class="logo" style="width:${px}px;height:${px}px"><img src="${LOGO}" alt="סמל ${SCHOOL_NAME}"></span>`;

/* ---------- תקשורת עם השרת ---------- */
async function api(payload){
  if (DEMO) return demoApi(payload);
  const res = await fetch(CONFIG.API_URL, { method:"POST", body: JSON.stringify(payload) });
  if (!res.ok) throw new Error("net");
  return res.json();
}

/* ---------- בדיקת ת.ז ישראלית ---------- */
function validId(raw){
  let id = String(raw||"").replace(/\D/g,"");
  if (id.length < 5 || id.length > 9) return false;
  id = id.padStart(9,"0");
  let sum = 0;
  for (let i=0;i<9;i++){ let n = +id[i] * (i%2+1); if (n>9) n-=9; sum+=n; }
  return sum % 10 === 0;
}

/* ---------- שמירה מקומית (רענון / טלפון נכבה) ---------- */
const storeKey = () => "olyExam_" + (S.session?.id || "");
function saveLocal(){
  try { localStorage.setItem(storeKey(), JSON.stringify({answers:S.answers, idx:S.idx, outLog:S.outLog})); } catch(e){}
}
function loadLocal(){
  try { return JSON.parse(localStorage.getItem(storeKey()) || "null"); } catch(e){ return null; }
}
function clearLocal(){ try { localStorage.removeItem(storeKey()); localStorage.removeItem("olyTok_"+S.session.id); } catch(e){} }
const getToken = id => { try { return localStorage.getItem("olyTok_"+id) || ""; } catch(e){ return ""; } };
const setToken = (id,t) => { try { localStorage.setItem("olyTok_"+id, t); } catch(e){} };

        <div class="field"><label for="last">שם משפחה</label><input id="last" value="${esc(p.last||"")}" required></div>
      </div>
      <div class="row2">
        <div class="field"><label for="cls">כיתה</label>
          <select id="cls" required><option value="">בחרו כיתה</option>${opt(CONFIG.CLASSES)}</select></div>
        <div class="field"><label for="teacher">מורה</label>
          <select id="teacher" required><option value="">בחרו מורה</option>${opt(CONFIG.TEACHERS)}</select></div>
      </div>
      <button class="btn wide" id="loginBtn" type="submit">כניסה למבחן</button>
    </form>
  </div>`;
  if (p.cls) $("#cls").value = p.cls;
  if (p.teacher) $("#teacher").value = p.teacher;
  $("#loginForm").addEventListener("submit", onLogin);
}

async function onLogin(e){
  e.preventDefault();
  const v = id => $("#"+id).value.trim();
  const sess = { id:v("id").replace(/\D/g,"").padStart(9,"0"), password:v("pw"), first:v("first"), last:v("last"), cls:v("cls"), teacher:v("teacher") };
  S.session = sess;
  if (!validId(v("id"))) return renderLogin("מספר ת.ז אינו תקין. בדקו שהקלדתם את כל 9 הספרות.");
  sess.token = getToken(sess.id);
  if (!sess.password && !sess.token) return renderLogin("הקלידו את סיסמת המבחן.");
  if (!sess.first || !sess.last) return renderLogin("מלאו שם פרטי ושם משפחה.");
  if (!sess.cls || !sess.teacher) return renderLogin("בחרו כיתה ומורה.");

  const btn = $("#loginBtn");
  btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> נכנסים...`;
  try {
    const r = await api({ action:"login", ...sess });
    if (!r.ok) return renderLogin(r.error);
    S.exam = r;
    if (r.token){ S.session.token = r.token; setToken(sess.id, r.token); }
    S.offset = r.serverNow - Date.now();
    S.deadline = r.startedAt + r.durationMin*60000;
    S.flat = r.parts.flatMap((p,pi) => p.questions.map((q,qi) => ({...q, pi, qi, partTitle:p.title, instructions:p.instructions, points:p.points, nInPart:p.questions.length})));
    const local = loadLocal();
    if (local){ S.answers = local.answers || {}; S.idx = Math.min(local.idx||0, S.flat.length-1); S.outLog = local.outLog||[]; S.tabOut = S.outLog.length; }
    else { S.answers = {}; S.idx = 0; }
    local ? startExam() : renderIntro();
  } catch(err){
    renderLogin("אין חיבור לשרת. בדקו את האינטרנט ונסו שוב.");
  }
}

/* =================================================================== */
/* מסך המבחן                                                           */
/* =================================================================== */
function startExam(){
  $("#app").innerHTML = `
  <div class="topbar"><div class="in">
    <div class="tb-row">
      <div class="tb-who">${logo(34)}<div class="who">${esc(S.session.first+" "+S.session.last)}</div></div>
      <div class="clock" id="clock" aria-live="off">--:--</div>
    </div>
    <div class="track" aria-hidden="true">
      <div class="lanes"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="fill lanes" id="fill"><i></i><i></i><i></i><i></i><i></i></div>
      <span class="runner" id="runner"></span>
    </div>
  </div></div>
  <div class="wrap" style="padding-top:0">
    <div id="qArea"></div>
  </div>
  <nav class="bottombar"><div class="in">
    <button class="btn ghost" id="prevBtn" onclick="go(-1)">הקודמת</button>
    <button class="btn navbtn" onclick="openMap()"><span class="gridic" aria-hidden="true"><i></i><i></i><i></i><i></i></span>כל השאלות</button>
    <button class="btn" id="nextBtn" onclick="go(1)">הבאה</button>
  </div></nav>`;
  startClock();
  renderQuestion();
}

function renderQuestion(){
  const q = S.flat[S.idx];
  const a = S.answers[q.key];
  let body = "";
  if (q.type === "open"){
    body = `<input class="open-in" id="openIn" dir="auto" autocomplete="off" placeholder="כתבו את התשובה כאן" value="${esc(a||"")}">
            <div class="saved" id="saved"></div>`;
  } else {
    body = `<div class="opts ${q.type==="tf"?"tf":""}" role="radiogroup" aria-labelledby="qtext">
      ${q.options.map(o=>`<button class="opt" role="radio" data-id="${o.id}" aria-checked="${String(a)===String(o.id)}" onclick="pick('${q.key}',${o.id})"><span class="dot"></span><span>${esc(o.text)}</span></button>`).join("")}
    </div>`;
  }
  const firstInPart = q.qi === 0;
  $("#qArea").innerHTML = `
    <div class="qmeta"><b>${partName(q.pi)}, שאלה ${q.qi+1} מתוך ${q.nInPart}</b><span>${fmtPts(q.points)} נק'</span></div>
    ${firstInPart ? `<p style="color:#C9D3E6;margin:-4px 4px 12px;font-size:15px">${esc(q.instructions)}</p>` : ""}
    <article class="qcard">
      <h2 class="qtext" id="qtext">${esc(q.text)}</h2>
      ${body}
    </article>`;
  if (q.type === "open"){
    const inp = $("#openIn");
    inp.addEventListener("input", () => { S.answers[q.key] = inp.value; saveLocal(); $("#saved").textContent = "נשמר"; updateProgress(); });
  }
  $("#prevBtn").disabled = S.idx === 0;
  const last = S.idx === S.flat.length-1;
  $("#nextBtn").textContent = last ? "סיום והגשה" : "הבאה";
  $("#nextBtn").className = "btn" + (last ? " go" : "");
  updateProgress();
  window.scrollTo({top:0});
}

const fmtPts = p => Number.isInteger(p) ? p : p.toFixed(1);

function pick(key, id){
  S.answers[key] = id;
  saveLocal();
  document.querySelectorAll(".opt").forEach(b => b.setAttribute("aria-checked", b.dataset.id === String(id) ? "true" : "false"));
  updateProgress();
}

function go(d){
  if (d > 0 && S.idx === S.flat.length-1) return openConfirm();
  S.idx = Math.max(0, Math.min(S.flat.length-1, S.idx+d));
  saveLocal(); renderQuestion();
}

const isAnswered = q => { const a = S.answers[q.key]; return a !== undefined && a !== null && String(a).trim() !== ""; };

function updateProgress(){
  const n = S.flat.filter(isAnswered).length, tot = S.flat.length;
  const pct = tot ? n/tot*100 : 0;
  const fill = $("#fill"), runner = $("#runner");
  if (!fill) return;
  fill.style.width = pct + "%";
  runner.style.right = Math.min(94, Math.max(6, pct)) + "%";
  runner.textContent = `${n}/${tot}`;
}

/* ---------- מפת שאלות ---------- */
function openMap(){
  let html = "";
  S.exam.parts.forEach((p,pi) => {
    html += `<div class="grid-part">${esc(p.title)}</div><div class="qgrid">`;
    S.flat.forEach((q,i) => { if (q.pi !== pi) return;
      html += `<button class="${isAnswered(q)?"done":""} ${i===S.idx?"cur":""}" onclick="jump(${i})" aria-label="שאלה ${q.qi+1}">${q.qi+1}</button>`;
    });
    html += `</div>`;
  });
  html += `<button class="btn go wide" style="margin-top:18px" onclick="closeMap();openConfirm()">הגשת המבחן</button>`;
  $("#mapBody").innerHTML = html;
  const done = S.flat.filter(isAnswered).length;
  $("#mapCount").textContent = done === S.flat.length
    ? `ענית על כל ${S.flat.length} השאלות. לחיצה על מספר פותחת את השאלה.`
    : `ענית על ${done} מתוך ${S.flat.length} שאלות. לחיצה על מספר פותחת את השאלה.`;
  $("#mapSheet").hidden = false;
}
function closeMap(){ $("#mapSheet").hidden = true; }
function jump(i){ S.idx = i; closeMap(); saveLocal(); renderQuestion(); }
$("#mapSheet").addEventListener("click", e => { if (e.target.id === "mapSheet") closeMap(); });

/* ---------- שעון ---------- */
function startClock(){
  clearInterval(S.timer);
  const tick = () => {
    const left = S.deadline - (Date.now() + S.offset);
    const el = $("#clock");
    if (left <= 0){
      clearInterval(S.timer);
      if (el) el.textContent = "00:00";
      if (!S.submitting) doSubmit(true);
      return;
    }
    const m = Math.floor(left/60000), s = Math.floor(left%60000/1000);
    if (el){ el.textContent = `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`; el.classList.toggle("warn", left < 5*60000); }
  };
  tick(); S.timer = setInterval(tick, 1000);
}

/* ---------- הגשה ---------- */
function openConfirm(){
  const missing = S.flat.filter(q=>!isAnswered(q)).length;
  $("#cfText").innerHTML = missing
    ? `נשארו <b>${missing}</b> שאלות בלי תשובה. שאלה בלי תשובה מקבלת 0 נקודות. אחרי ההגשה אי אפשר לחזור למבחן.`
    : `ענית על כל השאלות. אחרי ההגשה אי אפשר לחזור למבחן.`;
  $("#confirmModal").hidden = false;
  $("#cfGo").focus();
}
function closeConfirm(){ $("#confirmModal").hidden = true; }

async function doSubmit(auto){
  if (S.submitting) return;
  S.submitting = true;
  const btn = $("#cfGo");
  if (btn){ btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> מגישים...`; }
  if (auto){ closeMap(); }
  for (let attempt = 1; attempt <= 4; attempt++){
    try {
      const r = await api({ action:"submit", id:S.session.id, password:S.session.password, token:S.session.token||"", first:S.session.first, last:S.session.last, cls:S.session.cls, teacher:S.session.teacher, answers:S.answers, tabOut:S.outLog.length, outLog:S.outLog });
      if (!r.ok) throw Object.assign(new Error(r.error), {server:true});
      clearInterval(S.timer); clearLocal(); closeConfirm();
      return renderDone(r, auto);
    } catch(err){
      if (err.server || attempt === 4){
        S.submitting = false;
        if (btn){ btn.disabled = false; btn.textContent = "הגשת המבחן"; }
        showToast((err.server ? err.message : "ההגשה לא הצליחה בגלל בעיית חיבור.") + " התשובות שמורות במכשיר. נסו להגיש שוב.");
        if (auto) openConfirm();
        return;
      }
      await new Promise(r=>setTimeout(r, 1500*attempt));
    }
  }
}

function showToast(msg){
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(showToast._t); showToast._t = setTimeout(()=>t.hidden=true, 7000);
}

/* =================================================================== */
/* מסך סיום                                                            */
/* =================================================================== */
function renderDone(r, auto){
  let medal = "plain", inner = "✓", line = "";
  if (r.showScore && typeof r.score === "number"){
    medal = r.score >= 90 ? "" : r.score >= 75 ? "silver" : r.score >= 55 ? "bronze" : "plain";
    inner = r.score;
    line = r.pendingReview ? "הציון לפני בדיקת שאלות ההשלמה על ידי המורה, והוא עשוי לעלות." : "";
  }
  $("#app").innerHTML = `
  <div class="wrap done">
    <div style="display:flex;justify-content:center;margin:-16px 0 26px">${brand(56)}</div>
    <div class="medal ${medal}" aria-hidden="true">${inner}</div>
    <h2>${auto ? "הזמן נגמר, המבחן הוגש" : "המבחן הוגש"}</h2>
    <p>${esc(r.message || "")}</p>
    ${r.showScore && typeof r.score === "number" ? `<p>הציון שלך: <b style="color:#fff">${r.score}</b></p>` : `<p>הציון יפורסם על ידי המורה.</p>`}
    ${line ? `<p class="hint" style="color:#9FB0CC">${esc(line)}</p>` : ""}
    <div class="lanes" aria-hidden="true" style="max-width:260px;margin:28px auto 0"><i></i><i></i><i></i><i></i><i></i></div>
    <p style="margin-top:24px">אפשר לסגור את הדף.</p>
  </div>`;
}

/* ---------- מעקב יציאה מהמסך ---------- */
const examActive = () => S.exam && !S.submitting && !!document.getElementById("qArea");
function markOut(hidden){
  if (!examActive()) return;
  if (!S.outSince) S.outSince = Date.now();
  if (hidden) S.outHidden = true;
}
function markBack(){
  if (!S.outSince || document.hidden || !document.hasFocus()) return;
  const secs = Math.round((Date.now() - S.outSince) / 1000);
  const counted = S.outHidden || secs >= 2;   // מעבר קצרצר של פוקוס (פחות מ-2 שנ') לא נספר
  S.outSince = 0; S.outHidden = false;
  if (!counted || !examActive()) return;
  S.outLog.push(secs); S.tabOut = S.outLog.length; saveLocal();
  showOutWarning(secs);
}
document.addEventListener("visibilitychange", () => document.hidden ? markOut(true) : markBack());
window.addEventListener("blur", () => markOut(false));
window.addEventListener("focus", markBack);

function showOutWarning(secs){
  const n = S.outLog.length;
  $("#outText").innerHTML = `זו היציאה ה-<b>${n}</b> שלך מדף המבחן (${secs} שניות מחוץ לדף).<br>היציאה נרשמה ותדווח למורה יחד עם המבחן.`;
  $("#outModal").hidden = false;
  $("#outOk").focus();
}
function closeOut(){ $("#outModal").hidden = true; }
window.addEventListener("beforeunload", e => {
  if (S.exam && !S.submitting){ saveLocal(); e.preventDefault(); e.returnValue = ""; }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape"){ closeMap(); closeConfirm(); closeOut(); }
});


/* =================================================================== */
/* לוח בקרה למורה — נפתח בכתובת האתר עם #admin                        */
/* =================================================================== */
const A = { pw:"", data:null, timer:null, busy:false };
const admKey = "olyAdminPw";

function renderAdminLogin(err){
  clearInterval(A.timer);
  $("#app").innerHTML = `
  <div class="wrap adm">
    ${brand(52)}
    <h1>לוח בקרה למורה</h1>
    <form class="card" id="admForm">
      ${DEMO ? `<div class="demo">מצב תצוגה: השרת לא מחובר. כל סיסמה תעבוד.</div>` : ""}
      ${err ? `<div class="err" role="alert">${esc(err)}</div>` : ""}
      <div class="field"><label for="apw">סיסמת מורה</label>
        <input id="apw" type="password" autocomplete="current-password" required></div>
      <label style="display:flex;gap:8px;align-items:center;margin-bottom:14px;font-weight:600">
        <input type="checkbox" id="aremember" checked style="width:20px;height:20px"> לזכור במכשיר הזה</label>
      <button class="btn wide" id="admBtn" type="submit">כניסה</button>
    </form>
  </div>`;
  $("#admForm").addEventListener("submit", async e => {
    e.preventDefault();
    A.pw = $("#apw").value.trim();
    const remember = $("#aremember").checked;
    $("#admBtn").disabled = true; $("#admBtn").innerHTML = `<span class="spinner"></span> נכנסים...`;
    const ok = await adminCall({op:"status"});
    if (ok){ try { remember ? localStorage.setItem(admKey, A.pw) : localStorage.removeItem(admKey); } catch(e){} }
  });
}

async function adminCall(extra){
  if (A.busy) return false;
  A.busy = true;
  try {
    const r = await api({ action:"admin", adminPassword:A.pw, ...extra });
    A.busy = false;
    if (!r.ok){
      if (/סיסמת המורה/.test(r.error||"")){ try{localStorage.removeItem(admKey);}catch(e){} renderAdminLogin(r.error); }
      else showToast(r.error);
      return false;
    }
    A.data = r; renderAdmin(); return true;
  } catch(e){
    A.busy = false;
    if (!A.data) renderAdminLogin("אין חיבור לשרת. בדקו את האינטרנט ונסו שוב.");
    else showToast("אין חיבור לשרת. הנתונים על המסך אולי לא עדכניים.");
    return false;
  }
}

function renderAdmin(){
  const d = A.data;
  const items = d.inProgress.map(p => `<li><span>${esc(p.name)}, ${esc(p.cls)}</span>
      <span class="${p.minutes > d.durationMin ? "late" : ""}">${p.minutes} דק'</span></li>`).join("");
  $("#app").innerHTML = `
  <div class="wrap adm">
    ${brand(52)}
    <h1>לוח בקרה למורה</h1>

    <section class="card state">
      <div class="lbl ${d.open?"on":"off"}"><span class="dotc" style="background:${d.open?"var(--green)":"#C21F3A"}"></span>${d.open?"המבחן פתוח":"המבחן נעול"}</div>
      <button class="btn ${d.open?"red":"go"}" onclick="adminCall({op:'setOpen', value:${!d.open}})">${d.open?"נעילת המבחן":"פתיחת המבחן"}</button>
      <p class="hint" style="width:100%;margin:0">${d.open?"תלמידים עם הסיסמה יכולים להיכנס עכשיו.":"אי אפשר להיכנס. תלמידים שכבר באמצע המבחן ממשיכים ומגישים כרגיל."}</p>
    </section>

    <section class="card">
      <b>סיסמת התלמידים כרגע</b>
      <div class="pwbig">${esc(d.password)}</div>
      <div class="pwrow">
        <input id="newPw" placeholder="סיסמה חדשה" autocomplete="off" dir="auto">
        <button class="btn" onclick="savePw()">שמירה</button>
      </div>
      <button class="btn ghost wide" style="margin-top:10px" onclick="randomPw()">סיסמה חדשה אקראית (6 תווים)</button>
      <p class="hint">תלמידים שכבר נכנסו לא מושפעים מהחלפת הסיסמה.</p>
    </section>

    <section class="card">
      <div class="stats">
        <div class="stat"><b>${d.startedToday}</b><span>נכנסו היום</span></div>
        <div class="stat"><b>${d.submittedToday}</b><span>הגישו היום</span></div>
        <div class="stat"><b>${d.inProgress.length}</b><span>באמצע עכשיו</span></div>
      </div>
      ${d.inProgress.length ? `<ul class="plist">${items}</ul>` : `<p class="hint" style="margin-top:12px">אין כרגע תלמידים באמצע מבחן.</p>`}
    </section>

    <section class="links">
      <a class="btn go" href="${esc(d.xlsxUrl)}" target="_blank" rel="noopener">הורדה לאקסל</a>
      <a class="btn ghost" style="background:var(--paper)" href="${esc(d.sheetUrl)}" target="_blank" rel="noopener">פתיחת הגיליון</a>
      <button class="btn ghost" style="background:var(--paper)" onclick="adminCall({op:'status'})">רענון</button>
      <button class="btn ghost" style="background:var(--paper)" onclick="adminLogout()">יציאה</button>
    </section>
    <p class="small">סה"כ הגשות מאז ההקמה: ${d.submittedTotal}. הנתונים מתרעננים לבד כל 20 שניות.</p>
  </div>`;
  clearInterval(A.timer);
  A.timer = setInterval(() => { if (!document.hidden) adminCall({op:"status"}); }, 20000);
}

function savePw(){
  const v = $("#newPw").value.trim();
  if (v.length < 3) return showToast("הסיסמה צריכה להיות לפחות 3 תווים.");
  adminCall({op:"setPassword", value:v});
}
function randomPw(){
  // 6 תווים: אותיות קטנות באנגלית + ספרות, בלי תווים שקל לבלבל (0/o, 1/l/i)
  const L = "abcdefghjkmnpqrstuvwxyz", D = "23456789", ALL = L + D;
  const pick = s => s[crypto.getRandomValues(new Uint32Array(1))[0] % s.length];
  let v;
  do { v = Array.from({length:6}, () => pick(ALL)).join(""); }
  while (!/[a-z]/.test(v) || !/[0-9]/.test(v));   // לפחות אות אחת וספרה אחת
  adminCall({op:"setPassword", value:v});
}
function adminLogout(){
  try { localStorage.removeItem(admKey); } catch(e){}
  A.pw = ""; A.data = null; renderAdminLogin();
}
function startAdmin(){
  let saved = ""; try { saved = localStorage.getItem(admKey) || ""; } catch(e){}
  if (saved){ A.pw = saved; $("#app").innerHTML = `<div class="wrap adm">${brand(52)}<h1>לוח בקרה למורה</h1></div>`; adminCall({op:"status"}); }
  else renderAdminLogin();
